name: CI
on:
  push:
  pull_request:
  schedule:
    - cron: "17 9 * * 1"   # weekly, so a broken toolchain or mirror shows up even without commits
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Round trips, corrupt-input checks and sanitizer fuzzing
        run: bash scripts/ci_check.sh 300
